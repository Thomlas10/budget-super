<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget App - Suivi des dépenses</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📊 Mon Budget</h1>

        <div class="summary">
            <h2>Résumé par catégorie</h2>
            <div id="categorySummary" class="category-summary"></div>
        </div>

        <div class="form-section">
            <h2>Ajouter une dépense</h2>
            <form id="expenseForm">
                <div class="form-group">
                    <label for="amount">Montant (€)</label>
                    <input type="number" id="amount" placeholder="0.00" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="category">Catégorie</label>
                    <select id="category" required>
                        <option value="">Sélectionner une catégorie</option>
                        <option value="Alimentation">Alimentation</option>
                        <option value="Transport">Transport</option>
                        <option value="Divertissement">Divertissement</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>

                <button type="submit" class="btn-submit">Ajouter</button>
            </form>
        </div>

        <div class="expenses-section">
            <h2>Historique des dépenses</h2>
            <div id="expensesList" class="expenses-list"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
